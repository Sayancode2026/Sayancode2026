<svg width="900" height="330" viewBox="0 0 900 330" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="barGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#D4AF37"/>
      <stop offset="100%" stop-color="#8b6f1f"/>
    </linearGradient>
  </defs>
  <rect width="900" height="330" rx="14" fill="#0d1117" stroke="#30363d" stroke-width="1"/>
  <text x="30" y="40" font-family="JetBrains Mono, monospace" font-size="18" fill="#D4AF37" font-weight="bold">// stack_confidence.log</text>

  <g font-family="JetBrains Mono, monospace" font-size="14" fill="#c9d1d9">
    <!-- row template: label, value -->
    <g transform="translate(30,70)">
      <text y="0">Java / Spring Boot</text>
      <rect x="220" y="-14" width="600" height="16" rx="8" fill="#21262d"/>
      <rect x="220" y="-14" width="0" height="16" rx="8" fill="url(#barGrad)">
        <animate attributeName="width" from="0" to="522" dur="1.4s" begin="0.2s" fill="freeze"/>
      </rect>
      <text x="835" y="0" fill="#D4AF37">87%</text>
    </g>
    <g transform="translate(30,110)">
      <text y="0">Python / FastAPI</text>
      <rect x="220" y="-14" width="600" height="16" rx="8" fill="#21262d"/>
      <rect x="220" y="-14" width="0" height="16" rx="8" fill="url(#barGrad)">
        <animate attributeName="width" from="0" to="558" dur="1.4s" begin="0.4s" fill="freeze"/>
      </rect>
      <text x="835" y="0" fill="#D4AF37">93%</text>
    </g>
    <g transform="translate(30,150)">
      <text y="0">LangChain / RAG</text>
      <rect x="220" y="-14" width="600" height="16" rx="8" fill="#21262d"/>
      <rect x="220" y="-14" width="0" height="16" rx="8" fill="url(#barGrad)">
        <animate attributeName="width" from="0" to="510" dur="1.4s" begin="0.6s" fill="freeze"/>
      </rect>
      <text x="835" y="0" fill="#D4AF37">85%</text>
    </g>
    <g transform="translate(30,190)">
      <text y="0">Computer Vision (YOLOv8)</text>
      <rect x="220" y="-14" width="600" height="16" rx="8" fill="#21262d"/>
      <rect x="220" y="-14" width="0" height="16" rx="8" fill="url(#barGrad)">
        <animate attributeName="width" from="0" to="480" dur="1.4s" begin="0.8s" fill="freeze"/>
      </rect>
      <text x="835" y="0" fill="#D4AF37">80%</text>
    </g>
    <g transform="translate(30,230)">
      <text y="0">System Design (HLD/LLD)</text>
      <rect x="220" y="-14" width="600" height="16" rx="8" fill="#21262d"/>
      <rect x="220" y="-14" width="0" height="16" rx="8" fill="url(#barGrad)">
        <animate attributeName="width" from="0" to="450" dur="1.4s" begin="1.0s" fill="freeze"/>
      </rect>
      <text x="835" y="0" fill="#D4AF37">75%</text>
    </g>
    <g transform="translate(30,270)">
      <text y="0">Competitive Programming (C++)</text>
      <rect x="220" y="-14" width="600" height="16" rx="8" fill="#21262d"/>
      <rect x="220" y="-14" width="0" height="16" rx="8" fill="url(#barGrad)">
        <animate attributeName="width" from="0" to="462" dur="1.4s" begin="1.2s" fill="freeze"/>
      </rect>
      <text x="835" y="0" fill="#D4AF37">77%</text>
    </g>
  </g>
  <text x="30" y="315" font-family="JetBrains Mono, monospace" font-size="11" fill="#6e7681">self-reported, updated manually — not a scraped metric</text>
</svg>
